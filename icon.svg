<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="face1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="100%" style="stop-color:#00aa55"/>
    </linearGradient>
    <linearGradient id="face2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00aa"/>
      <stop offset="100%" style="stop-color:#aa0077"/>
    </linearGradient>
    <linearGradient id="face3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffff00"/>
      <stop offset="100%" style="stop-color:#ffaa00"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#020205"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 3D Cube -->
  <g transform="translate(256, 256)">
    <!-- Left face (green) -->
    <polygon points="-120,0 0,-70 0,70 -120,140" fill="url(#face1)" opacity="0.9"/>

    <!-- Right face (magenta) -->
    <polygon points="0,-70 120,0 120,140 0,70" fill="url(#face2)" opacity="0.9"/>

    <!-- Top face (yellow) -->
    <polygon points="-120,0 0,-70 120,0 0,70" fill="url(#face3)" opacity="0.9"/>

    <!-- Cube edges -->
    <g stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none">
      <line x1="-120" y1="0" x2="0" y2="-70"/>
      <line x1="0" y1="-70" x2="120" y2="0"/>
      <line x1="120" y1="0" x2="0" y2="70"/>
      <line x1="0" y1="70" x2="-120" y2="0"/>
      <line x1="-120" y1="0" x2="-120" y2="140"/>
      <line x1="120" y1="0" x2="120" y2="140"/>
      <line x1="0" y1="70" x2="0" y2="210"/>
      <line x1="-120" y1="140" x2="0" y2="70"/>
      <line x1="0" y1="70" x2="120" y2="140"/>
    </g>

    <!-- Inner color burst -->
    <g opacity="0.6">
      <circle cx="-30" cy="20" r="25" fill="#00ff88" filter="blur(10px)"/>
      <circle cx="30" cy="20" r="25" fill="#ff00aa" filter="blur(10px)"/>
      <circle cx="0" cy="-20" r="25" fill="#ffff00" filter="blur(10px)"/>
    </g>
  </g>

  <!-- Glow effect -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#face1)" stroke-width="1" opacity="0.2"/>
</svg>
